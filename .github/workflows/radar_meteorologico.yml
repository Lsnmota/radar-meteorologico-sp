name: Radar Meteorológico SP

on:
  schedule:
    # 07:00 UTC = 04:00 BRT (menor carga global nas filas do GitHub Actions)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script do radar
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python main.py
- name: Enviar notificação para o Telegram
        if: always() # Executa tanto se passar quanto se falhar
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" == "success" ]; then
            MENSAGEM="✅ *Radar Meteorológico SP* executado com sucesso e e-mails disparados!"
          else
            MENSAGEM="❌ *ALERTA*: Falha na execução do Radar Meteorológico SP!"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MENSAGEM}" \
            -d parse_mode="Markdown"
