name: Radar Meteorológico SP

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (06:00 BRT - Horário de Brasília)
    - cron: '0 9 * * *'
  # Permite a execução manual na aba Actions do GitHub
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script do radar
        env:
          # Adicione aqui suas variáveis de ambiente / secrets caso o script utilize
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py
